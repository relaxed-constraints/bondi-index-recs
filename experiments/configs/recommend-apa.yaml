method: apa
api_version: '2025-03-12'
api_timeout_seconds: 30
connection_timeout_ms: 10000
query_timeout_ms: 360000
batch_size: 1000
slow_query_ms: 1
workload_repetitions: 1
# Expand the APA request window on each side of the replay.
window_padding_seconds: 60
initial_delay_seconds: 60
minimum_wait_seconds: 120
poll_interval_seconds: 30
poll_timeout_seconds: 600
stable_polls: 3

# Opt in to saving and dropping secondary indexes before replay; retains _id_.
drop_existing_indexes: true
