[project]
name = "bondi-index-recs"
version = "0.1.0"
description = "Tracked document database workload and index recommendation experiments"
requires-python = ">=3.11"
dependencies = [
    "bondi==0.1.2",
    "yanex==0.6.1",
    "pymongo>=4.13,<5",
    "requests>=2.31,<3",
    "python-dotenv>=1,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
